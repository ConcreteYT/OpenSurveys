spring.application.name=OpenSurveys
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Without this, Spring Boot's default naming strategy silently lowercases every
# unquoted @Table/@Column name (e.g. FORM -> form, QUESTION -> question) when generating
# DDL/SQL. This makes Hibernate use @Table/@Column names exactly as written, so the
# schema it creates actually matches USER/FORM/QUESTION/ANSWER as specified.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Read by security.JwtUtil (via @Value) to sign/verify JWTs issued in AuthController and
# validated in JwtAuthFilter on every request. Rotating JWT_SECRET invalidates all
# previously issued tokens. Expiration is in milliseconds (86400000 = 24 hours).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Seeded by AdminBootstrap on startup so you can test /admin without manual DB edits.
# Login at /auth/login with these credentials, then open /admin.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD}

# Google OAuth Web Client ID (must match REACT_APP_GOOGLE_CLIENT_ID in the frontend .env).
app.google.client-id=${GOOGLE_CLIENT_ID}

# SMTP used by AccountController to email verification codes for email/password changes.
# Leave unset in local dev only if you do not need those flows; failed sends return 503.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@opensurveys.local}
